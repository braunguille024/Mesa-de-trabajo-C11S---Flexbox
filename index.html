<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="principal-container">
        <header class="header-container">
            <!--Parte del logo-->
            <div class="logo-container">
            <img src="img/VectorPizza.svg" alt="Logo Pizzeria">
            <h1>
                <span class="pizza">Pizza</span><span class="y">&</span><span class="Front">Front</span>
            </h1>
            </div>

            <!--Parte del Menú-->
            <nav class="menu">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Ranking</a></li>
                <li><a href="#">Promoción</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
            </nav>
        </header>
    
        <!--Columana 1-->
        <div class="columnas-container"> 
        <div class="promo">
            <h2 class="texto-flotante">
            <span class="texto-rojo">Envio gratis</span> comprando <span class="texto-rojo">2 pizzas</span>
            </h2>
            <img src="img/delivery.jpg" alt="Repartidor" class="img-fondo">
        </div>

        <!--Columna 2-->
        <div class="pizzas-top">
            <h2 class="titulo-podio">Podio de pizzas</h2>
            <div class="lista-pizzas">
                <div class="lista-texto">
                    <h3>Pizzas top 5</h3>
                    <ol>
                        <li>Muzzarella</li>
                        <li>Hawaiana</li>
                        <li>Muzzarella J&Morron</li>
                        <li>Fugazzeta</li>
                        <li>Calabresa</li>
                    </ol>
                </div>
            <img src="img/PizzaFalling.jpg" alt="Ingredientes" class="im-chica">
            </div>
        </div>
    </div>

        <footer class="footer-container">     
            <!--Parte del Menú Footer-->
            <nav class="menu-footer">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Ranking</a></li>
                <li><a href="#">Promoción</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
            </nav>

            <!--Parte del logo Footer-->
            <div class="logo-container">
            <img src="img/VectorPizza.svg" alt="Logo Pizzeria">
            <h1>
                <span class="pizza">Pizza</span><span class="y">&</span><span class="Front">Front</span>
            </h1>
            </div>         
        </footer>
  </body>       
</html>
